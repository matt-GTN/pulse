name: Security image validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        context: ["."]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: pulse:security-test
          cache-from: type=gha,scope=security-${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=security-${{ matrix.context }}
      - name: Reliability tests without network
        run: docker run --rm --network none --entrypoint /app/.venv/bin/python pulse:security-test -m unittest discover -s tests -v
